name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build and package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory dist | Out-Null
          foreach ($arch in 'amd64', 'arm64') {
            $name = "tbssh-$tag-windows-$arch"
            $stage = "stage/$name"
            New-Item -ItemType Directory "$stage/TerminalBrowserSsh" -Force | Out-Null
            $env:GOOS = 'windows'; $env:GOARCH = $arch
            go build -trimpath -ldflags "-s -w -X github.com/zfzfg/tbssh/internal/app.Version=$tag" -o "$stage/tbssh.exe" ./cmd/tbssh
            if ($LASTEXITCODE -ne 0) { throw "build $arch failed" }
            Copy-Item powershell/TerminalBrowserSsh/*.ps*1 "$stage/TerminalBrowserSsh/"
            Copy-Item scripts/install.ps1, scripts/uninstall.ps1, LICENSE, README.md $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          }
          Get-ChildItem dist/*.zip | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_).Hash)  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/* --title '${{ github.ref_name }}' --generate-notes --verify-tag
